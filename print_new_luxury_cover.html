<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Teena &amp; Kuldeep — The Royal Wedding Celebration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet">
  <style>
    @page {
      size: 148mm 210mm;
      margin: 0;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 148mm;
      height: 210mm;
      margin: 0;
      padding: 0;
      background-color: #F8F5EE;
      color: #380C16;
      font-family: 'Cormorant Garamond', Georgia, serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      overflow: hidden;
    }

    .luxury-canvas-wrapper {
      width: 148mm;
      height: 210mm;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 50% 28%, #FFFFFF 0%, #FAF6EE 45%, #F0E8D8 85%, #E6DBC6 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10mm 12mm 11mm;
      box-sizing: border-box;
    }

    /* Architectural 3D Multi-Layered Royal Palace Gateway */
    .architectural-portal {
      position: absolute;
      top: 6mm;
      bottom: 6mm;
      left: 6mm;
      right: 6mm;
      pointer-events: none;
      z-index: 1;
    }
    .portal-arch-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 2mm 5mm rgba(184, 139, 56, 0.18));
    }

    /* Subtle Paper Texture & Lighting Beam */
    .lighting-beam-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 25%, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0) 55%),
                  linear-gradient(180deg, rgba(212, 175, 101, 0.08) 0%, transparent 35%, rgba(212, 175, 101, 0.12) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Content Area with Sophisticated Editorial Negative Space */
    .editorial-content-layer {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
    }

    /* ==========================================================================
       1. TOP AREA: Minimalist Auspicious Lord Ganesha Emblem
       ========================================================================== */
    .top-emblem-container {
      margin-top: 4mm;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .emblem-halo {
      width: 15mm;
      height: 15mm;
      border-radius: 50%;
      background: radial-gradient(circle, #FFFDF8 0%, #F5ECDA 80%, #DFBF77 100%);
      border: 1pt solid #D4AF65;
      box-shadow: 0 1.5mm 4mm rgba(184, 139, 56, 0.25), inset 0 0 2mm rgba(212, 175, 101, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2mm;
    }
    .ganesha-sculpture-svg {
      width: 9.5mm;
      height: 9.5mm;
    }
    .auspicious-shloka-text {
      font-family: 'Cinzel', serif;
      font-size: 6.8pt;
      font-weight: 700;
      letter-spacing: 2.5px;
      color: #9E7422;
      text-transform: uppercase;
    }

    /* ==========================================================================
       2. CENTER AREA: THE ROYAL WEDDING & NAMES (THE VISUAL CENTERPIECE)
       ========================================================================== */
    .center-visual-centerpiece {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      margin: 1mm 0;
    }

    .editorial-heading-strip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3mm;
      width: 65%;
      margin-bottom: 3.5mm;
    }
    .editorial-heading-strip .gold-accent-line {
      flex: 1;
      height: 0.7pt;
      background: linear-gradient(90deg, transparent, #D4AF65, transparent);
    }
    .editorial-heading-strip .heading-text {
      font-family: 'Cinzel', serif;
      font-size: 8.5pt;
      font-weight: 800;
      letter-spacing: 4px;
      color: #7A5716;
      text-transform: uppercase;
    }

    .names-display-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2.5mm;
    }

    .bride-name-text {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 26pt;
      font-weight: 800;
      letter-spacing: 2.2px;
      line-height: 1.08;
      color: #4A0E1A; /* Deep Royal Burgundy */
      text-transform: uppercase;
    }
    .bride-teena-sub {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 15pt;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: #9E7422; /* Warm Gold */
      margin-left: 1.5mm;
    }

    .ampersand-editorial-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3.5mm;
      width: 48mm;
      margin: 0.8mm 0;
    }
    .ampersand-editorial-row .line {
      flex: 1;
      height: 0.6pt;
      background: linear-gradient(90deg, transparent, #C49A45, transparent);
    }
    .ampersand-editorial-row .symbol {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-size: 20pt;
      color: #B88B38;
      line-height: 1;
    }

    .groom-name-text {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 27pt;
      font-weight: 800;
      letter-spacing: 3px;
      line-height: 1.08;
      color: #4A0E1A;
      text-transform: uppercase;
    }

    /* Date Treatment */
    .date-treatment-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 3.5mm;
    }
    .date-primary-numbers {
      font-family: 'Cinzel', serif;
      font-size: 11pt;
      font-weight: 800;
      letter-spacing: 3px;
      color: #2E070F;
    }
    .date-day-sub {
      font-family: 'Cinzel', serif;
      font-size: 7.5pt;
      font-weight: 700;
      letter-spacing: 3px;
      color: #9E7422;
      margin-top: 0.8mm;
    }

    /* Romantic Tagline */
    .romantic-tagline-text {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 12.5pt;
      font-weight: 600;
      letter-spacing: 1.2px;
      color: #6B1724;
      margin-top: 3.5mm;
    }

    /* ==========================================================================
       3. LOWER SECTION: PROMINENT 3D METALLIC GOLD "CLICK HERE" CTA
       ========================================================================== */
    .cta-sculptural-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2mm;
    }

    .luxury-gold-button {
      display: block;
      width: 108mm;
      text-decoration: none;
      /* Main Button: Deep Royal Burgundy (#641B2E) to #3B101C */
      background: linear-gradient(135deg, #641B2E 0%, #4D1423 50%, #3B101C 100%);
      border: 1.5pt solid #D4AF65; /* Outer Border: Antique Gold */
      border-radius: 6.5mm;
      padding: 3.5mm 4mm;
      /* Subtle Warm Golden Glow & Soft Gold Shadow */
      box-shadow: 0 4mm 12mm rgba(59, 16, 28, 0.38),
                  0 0 10mm rgba(212, 175, 101, 0.35),
                  inset 0 1pt 1.5pt rgba(212, 175, 101, 0.45);
      cursor: pointer;
      text-align: center;
      position: relative;
    }

    .button-recessed-core {
      background: linear-gradient(180deg, #641B2E 0%, #3B101C 100%);
      border: 0.8pt solid #D4AF65;
      border-radius: 4.8mm;
      padding: 2.6mm 3mm;
      box-shadow: inset 0 1mm 2.5mm rgba(0, 0, 0, 0.45), 0 0 4mm rgba(212, 175, 101, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .btn-headline-text {
      font-family: 'Cinzel', serif;
      font-size: 14pt;
      font-weight: 900;
      letter-spacing: 3.5px;
      color: #E8D5A3; /* Champagne Gold */
      line-height: 1.1;
      display: flex;
      align-items: center;
      gap: 2mm;
    }
    .btn-headline-text .sparkle {
      color: #D4AF65; /* Antique Gold */
      font-size: 10pt;
    }

    .btn-sub-instruction {
      font-family: 'Cinzel', serif;
      font-size: 7.2pt;
      font-weight: 700;
      letter-spacing: 2px;
      color: #E8D5A3; /* Champagne Gold */
      margin-top: 1.2mm;
      text-transform: uppercase;
      opacity: 0.95;
    }

    .cta-subtext-guide {
      font-family: 'Montserrat', sans-serif;
      font-size: 6.5pt;
      font-weight: 500;
      letter-spacing: 0.6px;
      color: #8C6A28;
      margin-top: 2.5mm;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="luxury-canvas-wrapper" id="invitation-cover-page">
    
    <!-- 3D Architectural Palace Gateway Linework -->
    <div class="architectural-portal" aria-hidden="true">
      <svg class="portal-arch-svg" viewBox="0 0 136 198" preserveAspectRatio="none">
        <defs>
          <linearGradient id="portalGold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ECC878" />
            <stop offset="40%" stop-color="#D4AF65" />
            <stop offset="80%" stop-color="#B88B38" />
            <stop offset="100%" stop-color="#8A601E" />
          </linearGradient>
          <linearGradient id="softShadow" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="rgba(184, 139, 56, 0.15)" />
            <stop offset="100%" stop-color="rgba(184, 139, 56, 0.02)" />
          </linearGradient>
        </defs>

        <!-- Outer Beveled Border -->
        <rect x="1" y="1" width="134" height="196" rx="3.5" fill="none" stroke="url(#portalGold)" stroke-width="0.8" />
        <rect x="2.5" y="2.5" width="131" height="193" rx="2.5" fill="none" stroke="#D4AF65" stroke-width="0.3" stroke-dasharray="2 1.5" />

        <!-- Royal Multi-Foil Cusped Arch Archway -->
        <!-- Arch Spring line at y=46, apex at y=12, columns down to y=184 -->
        <path d="
          M 9,186
          L 9,56
          C 9,42 16,35 24,35
          C 28,35 34,31 38,24
          C 44,15 54,12 68,6
          C 82,12 92,15 98,24
          C 102,31 108,35 112,35
          C 120,35 127,42 127,56
          L 127,186
        " fill="url(#softShadow)" stroke="url(#portalGold)" stroke-width="0.75" />

        <!-- Inner Cusped Foil Arch Accent -->
        <path d="
          M 12,184
          L 12,58
          C 12,46 18,39 26,39
          C 30,39 36,35 40,28
          C 46,20 55,16 68,11
          C 81,16 90,20 96,28
          C 100,35 106,39 110,39
          C 118,39 124,46 124,58
          L 124,184
        " fill="none" stroke="#ECC878" stroke-width="0.35" opacity="0.8" />

        <!-- Architectural Keystone Finial at Top Apex -->
        <circle cx="68" cy="4" r="1.2" fill="#D4AF65" />
        <path d="M 68,0.5 L 68,3.5" stroke="#D4AF65" stroke-width="0.6" />

        <!-- Colonnade Bases & Capitals -->
        <rect x="7" y="55" width="4" height="2" rx="0.4" fill="url(#portalGold)" />
        <rect x="125" y="55" width="4" height="2" rx="0.4" fill="url(#portalGold)" />
        <rect x="7" y="184" width="4" height="2.5" rx="0.4" fill="url(#portalGold)" />
        <rect x="125" y="184" width="4" height="2.5" rx="0.4" fill="url(#portalGold)" />

        <!-- Corner Medallions -->
        <circle cx="7" cy="7" r="1.6" fill="url(#portalGold)" opacity="0.6" />
        <circle cx="129" cy="7" r="1.6" fill="url(#portalGold)" opacity="0.6" />
        <circle cx="7" cy="191" r="1.6" fill="url(#portalGold)" opacity="0.6" />
        <circle cx="129" cy="191" r="1.6" fill="url(#portalGold)" opacity="0.6" />
      </svg>
    </div>

    <!-- Soft Radial Lighting Overlay -->
    <div class="lighting-beam-overlay" aria-hidden="true"></div>

    <!-- Central Editorial Content Container -->
    <main class="editorial-content-layer">

      <!-- 1. TOP: Minimalist Auspicious Lord Ganesha Emblem -->
      <header class="top-emblem-container">
        <div class="emblem-halo">
          <svg class="ganesha-sculpture-svg" viewBox="0 0 50 50">
            <!-- Modern Elegant Lord Ganesha Monogram Silhouette -->
            <path d="M25 6 C20 6 16 10 16 15 C16 18 18 20 20 22 C18 24 17 27 17 31 C17 38 21 44 25 44 C29 44 33 38 33 31 C33 28 32 25 30 23 C32 21 34 18 34 15 C34 10 30 6 25 6 Z" fill="none" stroke="#9E7422" stroke-width="1.8" stroke-linecap="round" />
            <!-- Trunk Curvature (Right-facing traditional Ganesha) -->
            <path d="M25 24 Q28 29 28 34 Q28 39 25 40 Q22 41 21 38" fill="none" stroke="#7A5716" stroke-width="2" stroke-linecap="round" />
            <!-- Auspicious Tilak / Trishul -->
            <line x1="25" y1="9" x2="25" y2="16" stroke="#9E7422" stroke-width="1.5" stroke-linecap="round" />
            <circle cx="25" cy="8" r="1.2" fill="#9E7422" />
            <!-- Modak / Blessings Dot -->
            <circle cx="21" cy="36" r="1.2" fill="#7A5716" />
            <!-- Divine Ears -->
            <path d="M16 14 Q10 18 14 26" fill="none" stroke="#9E7422" stroke-width="1.2" stroke-linecap="round" />
            <path d="M34 14 Q40 18 36 26" fill="none" stroke="#9E7422" stroke-width="1.2" stroke-linecap="round" />
          </svg>
        </div>
        <div class="auspicious-shloka-text">|| SHREE GANESHAY NAMAH ||</div>
      </header>

      <!-- 2. CENTER: THE ROYAL WEDDING & NAMES -->
      <section class="center-visual-centerpiece">
        
        <!-- Header Strip -->
        <div class="editorial-heading-strip">
          <div class="gold-accent-line"></div>
          <h2 class="heading-text">THE ROYAL WEDDING CELEBRATION</h2>
          <div class="gold-accent-line"></div>
        </div>

        <!-- Bride & Groom Names -->
        <div class="names-display-block">
          <h1 class="bride-name-text">
            TEENA
          </h1>

          <div class="ampersand-editorial-row">
            <div class="line"></div>
            <span class="symbol">&amp;</span>
            <div class="line"></div>
          </div>

          <h1 class="groom-name-text">
            KULDEEP
          </h1>
        </div>

        <!-- Date Treatment -->
        <div class="date-treatment-block">
          <div class="date-primary-numbers">FRIDAY, 11 DECEMBER 2026</div>
        </div>

        <!-- Romantic Tagline -->
        <p class="romantic-tagline-text">
          TWO HEARTS. ONE BEAUTIFUL JOURNEY.
        </p>
      </section>

      <!-- 3. LOWER SECTION: PROMINENT 3D METALLIC GOLD CTA BUTTON -->
      <footer class="cta-sculptural-section">
        <a
          href="https://pushu1.github.io/param-pummy-wedding/"
          target="_blank"
          rel="noopener noreferrer"
          class="luxury-gold-button"
          id="btn-open-wedding-website"
          aria-label="Click here to open royal wedding invitation website"
        >
          <div class="button-recessed-core">
            <span class="btn-headline-text">
              <span class="sparkle">✦</span>
              CLICK HERE
              <span class="sparkle">✦</span>
            </span>
            <span class="btn-sub-instruction">OPEN YOUR WEDDING INVITATION</span>
          </div>
        </a>
      </footer>

    </main>
  </div>

</body>
</html>
